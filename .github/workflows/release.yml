# A tag v<version> (matching pom.xml's version) publishes a GitHub release with the
# jar and its SHA-256, after the same tests CI runs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: The tag matches pom.xml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"
          [ "v${version}" = "${TAG}" ] || { echo "tag ${TAG} but pom.xml says ${version}"; exit 1; }
      - run: mvn -B -ntp verify
      - run: scripts/integration-test.sh
      - name: Checksum
        run: cd target && for jar in keycloak-zoho-cpaas-email-sender-*.jar; do sha256sum "$jar" > "$jar.sha256"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          keycloak="$(mvn -B -ntp -q help:evaluate -Dexpression=keycloak.version -DforceStdout)"
          gh release create "${TAG}" target/keycloak-zoho-cpaas-email-sender-*.jar target/keycloak-zoho-cpaas-email-sender-*.jar.sha256 \
            --title "${TAG}" --notes "Built against and tested with Keycloak ${keycloak}. Check the jar with \`sha256sum -c\` before installing (README.md)."
